[project]
name = "budget-agent"
version = "0.1.0"
description = "Agentic AI orchestrator for BudgetAI"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "openai>=1.40",
    "azure-identity>=1.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pin the rule set explicitly. Newer ruff releases have expanded their default
# selection (adding isort/pyupgrade/etc.), which silently broke `ruff check` in
# CI even though the code was unchanged. Selecting ruff's classic default set
# keeps linting deterministic across ruff versions; opt into more rules
# deliberately rather than inheriting whatever a future ruff enables by default.
select = ["E4", "E7", "E9", "F"]
